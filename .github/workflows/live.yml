name: Parqet Zwischenstand

# Schiebt waehrend der europaeischen Handelszeit stuendlich den aktuellen Depotwert nach Parqet.
# Die Tagesreihe selbst schreibt der Hauptlauf (update.yml) nach Boersenschluss.
on:
  schedule:
    - cron: "5 6-16 * * 1-5"    # 06:05-16:05 UTC = 08:05-18:05 deutscher Sommerzeit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parqet-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Zwischenstand berechnen, Seite und Parqet aktualisieren
        env:
          PARQET_CLIENT_ID: ${{ secrets.PARQET_CLIENT_ID }}
          PARQET_REFRESH_TOKEN: ${{ secrets.PARQET_REFRESH_TOKEN }}
          PARQET_TOKEN_PAT: ${{ secrets.PARQET_TOKEN_PAT }}
          PARQET_PORTFOLIO_ID: ${{ secrets.PARQET_PORTFOLIO_ID }}
          PARQET_HOLDING_ID: ${{ secrets.PARQET_HOLDING_ID }}
        run: python live_update.py
      - name: Zwischenstand einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Zwischenstand $(date -u +%H:%M)"
          git pull --rebase --autostash -q || true
          git push
