name: Depots aktualisieren

on:
  schedule:
    - cron: "30 22 * * 1-5"   # werktags nach US-Boersenschluss (22:30 UTC)
    - cron: "30 5 * * 2-6"    # Sicherheitslauf frueh morgens, falls Kurse abends noch fehlten
  workflow_dispatch:
    inputs:
      test_benachrichtigung:
        description: "Test-Benachrichtigung senden"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update.py
        env:
          TEST_NOTIFY: ${{ inputs.test_benachrichtigung }}
      - name: Ergebnis einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Depots aktualisiert $(date -u +%Y-%m-%d)"
          git push
      - name: Tagesmeldung als Kommentar (eine Mail pro Tag)
        if: hashFiles('notify/body.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          marker="$(cat notify/marker.txt)"
          issue="$(gh issue list --state open --search 'Tagesmeldung in:title' --json number,title --jq '.[] | select(.title | startswith("Tagesmeldung")) | .number' | head -1)"
          if [ -z "$issue" ]; then
            issue="$(gh issue create --title "Tagesmeldung Depot-Duell" \
              --body "Hier kommt jeden Handelstag eine Meldung: handeln oder nichts tun, Gesamtwert, Wahrscheinlichkeit und ggf. die Orders." \
              | sed 's#.*/##')"
          fi
          if gh issue view "$issue" --json comments --jq '.comments[-3:][].body' | grep -Fq "$marker"; then
            echo "Meldung fuer $marker schon vorhanden"
          else
            title="$(cat notify/title.txt)"
            { echo "## $title"; echo; cat notify/body.md; } > /tmp/comment.md
            gh issue comment "$issue" --body-file /tmp/comment.md
          fi
