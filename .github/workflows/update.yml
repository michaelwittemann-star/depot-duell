name: Depots aktualisieren

on:
  schedule:
    # GitHub startet geplante Laeufe oft mit Verspaetung. Deshalb mehrere Anlaeufe: Der erste erfolgreiche
    # Lauf schreibt die Meldung, die spaeteren erkennen sie am Marker und schicken keine zweite Mail.
    - cron: "40 21 * * 1-5"   # kurz nach US-Schluss (23:40 Sommer / 22:40 Winter)
    - cron: "10 22 * * 1-5"
    - cron: "40 22 * * 1-5"
    - cron: "20 23 * * 1-5"
    - cron: "30 5 * * 1-6"    # Reservelauf morgens (auch montags)
    - cron: "30 7 * * 1-6"
  workflow_dispatch:
    inputs:
      test_benachrichtigung:
        description: "Test-Benachrichtigung senden"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update.py
        env:
          TEST_NOTIFY: ${{ inputs.test_benachrichtigung }}
      - name: Ergebnis einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/prices.csv docs/masterfonds.csv
          git diff --cached --quiet || git commit -m "Depots aktualisiert $(date -u +%Y-%m-%d)"
          git push
      - name: Tagesmeldung als Kommentar (eine Mail pro Tag)
        if: hashFiles('notify/body.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          marker="$(cat notify/marker.txt)"
          issue="$(gh issue list --state open --search 'Tagesmeldung in:title' --json number,title --jq '.[] | select(.title | startswith("Tagesmeldung")) | .number' | head -1)"
          if [ -z "$issue" ]; then
            issue="$(gh issue create --title "Tagesmeldung Depot-Duell" \
              --body "Hier kommt jeden Handelstag eine Meldung: handeln oder nichts tun, Gesamtwert, Wahrscheinlichkeit und ggf. die Orders." \
              | sed 's#.*/##')"
          fi
          if gh issue view "$issue" --json comments --jq '.comments[-3:][].body' | grep -Fq "$marker"; then
            echo "Meldung fuer $marker schon vorhanden"
          else
            gh issue comment "$issue" --body-file notify/body.md
          fi
