name: Depots aktualisieren

on:
  schedule:
    - cron: "30 22 * * 1-5"   # werktags nach US-Boersenschluss (22:30 UTC)
    - cron: "30 5 * * 2-6"    # Sicherheitslauf frueh morgens, falls Kurse abends noch fehlten
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update.py
      - name: Ergebnis einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Depots aktualisiert $(date -u +%Y-%m-%d)"
          git push
